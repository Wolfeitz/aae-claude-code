name: validate

on:
  push:
  pull_request:
  schedule:
    - cron: "41 8 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "adaptive-agentic-engineering @ git+https://github.com/Wolfeitz/adaptive-agentic-engineering.git" .
      - run: python -m unittest discover -s tests -v
      - if: github.event_name == 'schedule'
        run: npm install --global @anthropic-ai/claude-code@latest
      - if: github.event_name == 'schedule'
        run: aae-claude-code init . && aae-claude-code doctor . --strict
